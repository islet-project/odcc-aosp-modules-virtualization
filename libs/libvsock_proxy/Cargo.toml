[package]
name = "vsock-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
vsock = "0.5.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.28", features = ["poll", "fs", "socket"] }
